packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"

# Dependencies allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  "@scarf/scarf": false
  "@embedded-postgres/windows-x64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
  "@prisma/engines": true
  "prisma": true
  "argon2": true
  "@swc/core": true
  "esbuild": true
  "sharp": true
  "unrs-resolver": true
  "@nestjs/core": true

autoInstallPeers: true

minimumReleaseAgeExclude:
  - "@nestjs/common@12.3.3"
  - "@nestjs/core@12.3.3"
  - "@nestjs/platform-express@12.3.3"
  - "@nestjs/testing@12.3.3"
